name: Model CPU checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies and the pinned model kernel
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cpu]==0.11.2" "jaxlib==0.11.2"
          pip install -e ".[dev,weights]"
          pip check
      - name: Configuration, data, optimizer and deadline tests
        run: pytest tests -m "not kernel" -v --tb=short
      - name: Scope
        run: echo "CPU unit checks only; no TPU throughput, checkpoint-quality or full-model kernel certification."
